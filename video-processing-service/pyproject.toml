[project]
name = "app"
version = "1"
description = "A microservice that listens to Redis Stream queues and dynamically spawns Docker containers to process uploaded videos, enabling format conversion, thumbnail generation, and metadata extraction."
authors = [
    {name = "Ajay"}
]
packages = [{ include = "app" }]
license = {text = "1"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "docker (>=7.1.0,<8.0.0)",
    "redis (>=6.2.0,<7.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "pydantic (>=2.11.7,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
