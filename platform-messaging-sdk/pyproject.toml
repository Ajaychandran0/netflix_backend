[project]
name = "platform-messaging-sdk"
version = "0.1.0"
description = "Shared Redis Streams messaging SDK for platform microservices"
authors = [
    { name = "AJAY", email = "ajaychandranwork@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["redis", "redis-streams", "messaging", "microservices"]

dependencies = [
    "redis>=6.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"